<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f1a" />
  <title>{% block title %}Jobber{% endblock %}</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: '#13162a',
            card: '#1c2040',
            border: '#2a2f52',
            muted: '#6b7280',
          }
        }
      }
    }
  </script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body { background: #0d0f1a; color: #e8eaf6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .card { background: #1c2040; border: 1px solid #2a2f52; }
    .score-green  { background: #16a34a; }
    .score-blue   { background: #2563eb; }
    .score-yellow { background: #b45309; }
    .score-slate  { background: #475569; }
    .score-gray   { background: #374151; }
    .tag { background: #252a4a; color: #a5b4fc; border-radius: 9999px; padding: 2px 10px; font-size: 0.72rem; display:inline-flex; align-items:center; gap:3px; }
    .btn-primary { background: #4f46e5; color: white; border-radius: 0.5rem; padding: 0.5rem 1.25rem; font-weight: 600; font-size: 0.875rem; }
    .btn-primary:active { background: #4338ca; }
    .btn-ghost { background: #252a4a; color: #a5b4fc; border-radius: 0.5rem; padding: 0.5rem 1.25rem; font-weight: 500; font-size: 0.875rem; }
    .btn-ghost:active { background: #1e2240; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; border-radius: 0.5rem; padding: 0.5rem 1.25rem; font-weight: 500; font-size: 0.875rem; }
    .btn-success { background: #14532d; color: #86efac; border-radius: 0.5rem; padding: 0.5rem 1.25rem; font-weight: 500; font-size: 0.875rem; }
    .nav-active { color: #818cf8 !important; }
    .input { background: #252a4a; border: 1px solid #2a2f52; color: #e8eaf6; border-radius: 0.5rem; padding: 0.5rem 0.75rem; width: 100%; }
    .input:focus { outline: none; border-color: #4f46e5; }
    select.input option { background: #1c2040; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2f52; border-radius: 2px; }
  </style>
</head>
<body class="min-h-full pb-20">

  <!-- Top bar -->
  <header class="sticky top-0 z-50 px-4 py-3 flex items-center justify-between" style="background:#0d0f1a;border-bottom:1px solid #2a2f52;">
    <span class="font-bold text-indigo-400 text-lg tracking-tight">Jobber</span>
    <span class="text-xs text-gray-500">Vancouver · Full Stack</span>
  </header>

  <!-- Page content -->
  <main class="max-w-2xl mx-auto px-3 pt-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Bottom navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center py-2 px-4" style="background:#0d0f1a;border-top:1px solid #2a2f52;padding-bottom:env(safe-area-inset-bottom);">
    <a href="/" class="flex flex-col items-center gap-0.5 text-gray-500 {% if request.url.path == '/' %}nav-active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <span class="text-xs">Feed</span>
    </a>
    <a href="/applied" class="flex flex-col items-center gap-0.5 text-gray-500 {% if '/applied' in request.url.path %}nav-active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="text-xs">Applied</span>
    </a>
    <a href="/profile" class="flex flex-col items-center gap-0.5 text-gray-500 {% if '/profile' in request.url.path %}nav-active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-xs">Profile</span>
    </a>
    <a href="/scrape" class="flex flex-col items-center gap-0.5 text-gray-500 {% if '/scrape' in request.url.path %}nav-active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      <span class="text-xs">Scrape</span>
    </a>
  </nav>

  <script>
    // Status update helper used by job cards and detail pages
    async function setStatus(jobId, status, btn) {
      const res = await fetch(`/jobs/${jobId}/status`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({status})
      });
      if (res.ok) {
        const card = document.getElementById(`job-${jobId}`);
        if (card) {
          card.style.opacity = '0.4';
          card.style.pointerEvents = 'none';
        }
        if (btn) btn.textContent = '✓';
      }
    }
  </script>
</body>
</html>
